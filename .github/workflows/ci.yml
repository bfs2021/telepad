name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Database browser (#52–#54) against real servers: the driver code, row edits,
  # rollback, Read-only, cancel and structure changes (tests in db::client::live).
  db-live:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TELEPAD_TEST_MYSQL: "3306 root ci-only"
      TELEPAD_TEST_PG: "5432 postgres ci-only"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p telepad-core --locked db::client::live -- --nocapture

  # File window (#62–#64) against a real SSH server with and without SFTP
  # (tests/sshd image, made-up files), including rsync on the Linux runner.
  files-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start test SSH servers
        run: |
          set -e
          sudo apt-get install -y rsync >/dev/null || true
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/key"
          docker build -q -t telepad-test-sshd tests/sshd
          K="$(cat "$RUNNER_TEMP/key.pub")"
          docker run -d -e AUTHORIZED_KEY="$K" -p 127.0.0.1:2223:22 telepad-test-sshd
          docker run -d -e AUTHORIZED_KEY="$K" -e NO_SFTP=1 -p 127.0.0.1:2224:22 telepad-test-sshd
          for p in 2223 2224; do
            printf 'Host lab%s\n  HostName 127.0.0.1\n  Port %s\n  User telepad\n  IdentityFile %s\n  UserKnownHostsFile %s\n  StrictHostKeyChecking accept-new\n\n' \
              "$p" "$p" "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts" >> "$RUNNER_TEMP/config"
          done
          for i in $(seq 1 30); do ssh -F "$RUNNER_TEMP/config" -o BatchMode=yes lab2223 true && break; sleep 1; done
          echo "TELEPAD_TEST_SSH=$RUNNER_TEMP/config|lab2223|lab2224" >> "$GITHUB_ENV"
      - run: cargo test -p telepad-core --locked files::live_tests -- --nocapture
