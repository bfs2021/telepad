name: Release

# Push a tag that matches Cargo.toml's version, e.g.:
#   git tag v0.4.1 && git push origin v0.4.1
# Pull requests that touch the release files run every build as a dry run
# (nothing is published).
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'installer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: ubuntu-22.04, platform: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, platform: linux-aarch64 }
          - { runner: macos-latest, platform: macos-aarch64 }
          - { runner: macos-latest, platform: macos-x86_64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - name: Test
        if: matrix.target == ''
        run: cargo test --workspace --locked

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Installer
      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: sh scripts/package-unix.sh ${{ matrix.target }}

      - name: Check the package
        shell: bash
        run: |
          set -eu
          zip=$(ls dist/telepad-*-${{ matrix.platform }}.zip)
          test -f "$zip.sha256"
          echo "$zip"
          # Every .sha256 must verify with the standard tools (LF line ending, no BOM).
          for sum in dist/telepad-*-${{ matrix.platform }}*.sha256; do
            if grep -q $'\r' "$sum"; then echo "CR in $sum"; exit 1; fi
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum -c "$(basename "$sum")")
            else
              (cd dist && shasum -a 256 -c "$(basename "$sum")")
            fi
          done
          rm -rf /tmp/telepad-check-pkg && mkdir -p /tmp/telepad-check-pkg
          unzip -q "$zip" -d /tmp/telepad-check-pkg
          dir=$(ls -d /tmp/telepad-check-pkg/telepad-*)
          ls -l "$dir"
          test -f "$dir/portable"   # zips are portable: data next to the program
          if [ "${{ runner.os }}" = Windows ]; then
            "$dir/telepad-check.exe" --help
          else
            test -x "$dir/telepad" && test -x "$dir/telepad-check"
            file "$dir/telepad" "$dir/telepad-check"
            if [ -z "${{ matrix.target }}" ]; then "$dir/telepad-check" --help; fi
          fi

      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\telepad-*-windows-x86_64-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'telepad-install'
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait
          foreach ($f in 'telepad.exe', 'telepad-check.exe', 'README.txt', 'licenses\LICENSE-MIT') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "installer did not install $f" }
          }
          if (Test-Path (Join-Path $dir 'portable')) { throw 'the installer must not ship the portable marker' }
          & (Join-Path $dir 'telepad-check.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'telepad-check failed after install' }
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep 5
          if (Test-Path (Join-Path $dir 'telepad.exe')) { throw 'uninstall left telepad.exe behind' }
          Write-Output "installed to $dir, ran telepad-check, uninstalled"

      - uses: actions/upload-artifact@v4
        with:
          name: telepad-${{ matrix.platform }}
          path: |
            dist/telepad-*-${{ matrix.platform }}.zip
            dist/telepad-*-${{ matrix.platform }}.zip.sha256
            dist/telepad-*-${{ matrix.platform }}-setup.exe
            dist/telepad-*-${{ matrix.platform }}-setup.exe.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: telepad-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Telepad $v" --generate-notes
